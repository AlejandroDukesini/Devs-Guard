# Netlify deployment of the public web demo (static site, no functions).
# Docs: web/README.md. Security headers must match web/security-headers.js
# (checked by web/tests/headers.test.js).

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Never run third-party install scripts on the build machine.
  NPM_FLAGS = "--ignore-scripts"

# CISA's KEV feed has no CORS headers; the browser reads it same-origin.
[[redirects]]
  from = "/api/kev"
  to = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.osv.dev https://api.first.org; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
