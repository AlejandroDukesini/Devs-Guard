name: Release

# Triggered by pushing a tag like v1.0.0 (see docs/releasing.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        id: version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('dep_guard/__init__.py').read_text()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Test before releasing
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
      - name: Build (reproducible timestamps)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m pip install build
          python -m build
      - name: SBOM of the release (runtime dependencies)
        run: |
          python -m venv /tmp/rt && /tmp/rt/bin/pip install dist/*.whl
          /tmp/rt/bin/pip freeze --exclude-editable | grep -v '^devs-guard' > runtime-requirements.txt
          /tmp/rt/bin/depguard sbom runtime-requirements.txt -o dist/depguard-${{ steps.version.outputs.version }}.cdx.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: SLSA build provenance (Sigstore-signed)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

  pypi:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/devs-guard
    permissions:
      id-token: write # PyPI Trusted Publishing (no API token stored anywhere)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Keep only Python distributions
        run: rm -f dist/SHA256SUMS dist/*.cdx.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "DepGuard $TAG" \
            --notes "See CHANGELOG.md. Verify artifacts with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}" \
            --verify-tag
