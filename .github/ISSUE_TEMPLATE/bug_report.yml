name: Bug report
description: DepGuard crashed, produced a wrong exit code or a wrong report.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DepGuard version
      description: Output of `depguard --version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Run with `-vv` and paste the relevant output. Remove private package names if needed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
