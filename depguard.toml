# DepGuard configuration for this repository (dogfooding: CI scans itself).
# Reference: docs/configuration.md

[scan]
# Test fixtures contain intentionally vulnerable *fictional* packages, and the
# web demo ships intentionally outdated *sample* projects to scan.
exclude = ["fixtures/**", "tests/**", "web/src/demo/samples/**"]

[policy]
fail_on_priority = "P1"
fail_on_kev = true
fail_on_incomplete = true
fail_on_expired_ignore = true
